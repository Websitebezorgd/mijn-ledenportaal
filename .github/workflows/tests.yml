name: Tests

on:
    pull_request:
    workflow_call:

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # ubuntu-latest heeft PHP al geïnstalleerd
            - name: PHP-syntaxcontrole
              run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

            - name: Tests
              run: php tests/run.php
